name: lamon
description: "LAMON - Pemantauan Kesehatan Lambung (PBM Semester 5)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/lamon_icon_full.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon/lamon_icon_bg.png"
  adaptive_icon_foreground: "assets/icon/lamon_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/lamon_icon_full.png"
    background_color: "#FFF3BF"
    theme_color: "#276F8F"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icon/

  fonts:
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
